# ══════════════════════════════════════════════════════════════════════════════
# MODELOS HADRÓNICOS
# ══════════════════════════════════════════════════════════════════════════════
# Función de Rails: Xmax(lgE) = a + b·(lgE − 18) + c·(lgE − 18)²
# Valores de <Xmax> para protones (H) y hierro (Fe).
# Fuente: EPOS-LHC, Sibyll2.3c, QGSJetII-04 (compilación Auger)
hadronic_models:

  EPOS-LHC:
    H:  {a: 748.78, b: 57.73, c: -0.85}
    Fe: {a: 648.60, b: 63.12, c: -1.97}
    color:      "red"
    linestyle:  "-"

  Sibyll2.3c:
    H:  {a: 761.90, b: 57.40, c: -8.07e-10}
    Fe: {a: 656.60, b: 60.10, c: -1.60e-04}
    color:      "red"
    linestyle:  "--"

  QGSJetII-04:
    H:  {a: 733.34, b: 54.05, c: -0.16}
    Fe: {a: 635.93, b: 59.70, c: -1.98}
    color:      "red"
    linestyle:  "-."

  # Colores para hierro (mismo modelo, distinto estilo)
  Fe_color:    "blue"
  Fe_linestyle: "-"


# ══════════════════════════════════════════════════════════════════════════════
# CALIBRACIÓN (offsets empíricos)
# ══════════════════════════════════════════════════════════════════════════════
# Offsets aplicados a las predicciones para alinear con FD-Auger.
# Distintos valores según el dataset de validación usado.
calibration:

  # Dataset: datos_pca_cuanticos_backup (SDnewversion.csv)
  offset_general:  6.32536   # g/cm² — calibración original
  offset_pca:      4.05      # g/cm² — calibración con PCA + GPS

  # Dataset: baseO_filtrado_final.csv (Andrea/todosSD.root)
  offset_baseO:    4.05      # g/cm² — calibración validada con asesor

  # Corrección del target (aplicada en phase0)
  target_correction: 6.32536


# ══════════════════════════════════════════════════════════════════════════════
# LOTES DE ENERGÍA (para análisis por bins)
# ══════════════════════════════════════════════════════════════════════════════
# Rangos consistentes con el pipeline original datos_pca_cuanticos_backup.
energy_bins:

  bajo:
    lim_inf: 18.0
    lim_sup: 18.8
    color:   "blue"
    label:   "Bajo (18.0–18.8)"

  medio:
    lim_inf: 18.8
    lim_sup: 19.2
    color:   "green"
    label:   "Medio (18.8–19.2)"

  alto:
    lim_inf: 19.2
    lim_sup: 20.0
    color:   "red"
    label:   "Alto (19.2–20.0)"

  todo:
    lim_inf: 18.0
    lim_sup: 20.0
    color:   "gray"
    label:   "Todo (18.0–20.0)"

# Bins finos (0.1 dex) para gráficas de segundo momento
fine_bins:
  start: 18.5
  stop:  20.05
  step:  0.1
  min_events_per_bin: 5


# ══════════════════════════════════════════════════════════════════════════════
# ESTILOS DE GRÁFICAS
# ══════════════════════════════════════════════════════════════════════════════
# Consistencia visual entre todas las gráficas del pipeline.
plot_styles:

  # Configuraciones del proyecto (12 combos)
  configs:
    Original:                        {marker: 'o', color: 'tab:blue',   ls: '-'}
    Original_GPS_Quantum:            {marker: 's', color: 'tab:cyan',   ls: '--'}
    Original_Cuanticas:              {marker: '^', color: 'tab:green',  ls: '-'}
    Original_Cuanticas_GPS_Quantum:  {marker: 'D', color: 'tab:olive',  ls: '--'}
    Top30:                           {marker: 'o', color: 'tab:red',    ls: '-'}
    Top30_GPS_Quantum:               {marker: 's', color: 'tab:orange', ls: '--'}
    Top30_Cuanticas:                 {marker: '^', color: 'tab:pink',   ls: '-'}
    Top30_Cuanticas_GPS_Quantum:     {marker: 'D', color: 'tab:brown',  ls: '--'}
    PCA:                             {marker: 'o', color: 'tab:purple', ls: '-'}
    PCA_GPS_Quantum:                 {marker: 's', color: 'tab:gray',   ls: '--'}
    PCA_Cuanticas:                   {marker: '^', color: 'navy',       ls: '-'}
    PCA_Cuanticas_GPS_Quantum:       {marker: 'D', color: 'darkgreen',  ls: '--'}

  # Referencias experimentales
  references:
    PRD_111:  {marker: 'D', color: 'cyan',   alpha: 0.4, zorder: 5}
    PRD_114:  {marker: 'd', color: 'purple', alpha: 0.4, zorder: 4}
    PRD_90:   {marker: 's', color: 'steelblue', alpha: 0.7, zorder: 3}

  # Estilo global matplotlib
  matplotlib:
    font_family:    "serif"
    font_size:      12
    figure_dpi:     150
    axes_grid:      true
    grid_alpha:     0.3
    axes_linewidth: 1.2
    tick_direction: "in"