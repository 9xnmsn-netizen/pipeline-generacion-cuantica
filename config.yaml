    sigma:       [48.8, 43.4, 39.7, 38.4, 46.3,
                  38.8, 34.0, 33.2, 30.7, 27.3,
                  26.3, 24.2, 20.7, 25.1, 21.8]
    sigma_stat:  [0.6, 0.7, 0.6, 0.7, 0.6,
                  1.0, 0.8, 0.9, 1.26, 1.6,
                  1.3, 1.8, 1.4, 3.9, 5.4]

  PRD_114:
    # PRD 114, 0443016 (2026) — Tabla V (datos completos)
    logE_full:   [17.75, 17.85, 17.95, 18.05, 18.15,
                  18.25, 18.35, 18.45, 18.55, 18.65,
                  18.75, 18.85, 18.95, 19.05, 19.15,
                  19.25, 19.35, 19.44, 19.55, 19.71]
    xmax_full:   [703.1, 711.5, 719.3, 728.7, 737.9,
                  743.9, 750.4, 757.3, 758.9, 764.4,
                  762.2, 766.2, 770.0, 774.8, 773.7,
                  780.7, 780.8, 780.2, 791.9, 784.6]
    err_full:    [0.7, 0.8, 0.8, 1.0, 1.0,
