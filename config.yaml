                  19.05, 19.15, 19.25, 19.35, 19.45,
                  19.55, 19.64, 19.74, 19.85, 20.00]
    xmax:        [757.0, 758.8, 759.5, 761.8, 765.7,
                  770.0, 769.9, 774.0, 774.7, 775.3,
                  778.6, 783.2, 787.2, 794.5, 793.9]
    xmax_stat:   [0.5, 0.5, 0.5, 0.5, 0.5,
                  0.6, 0.6, 0.8, 0.95, 1.0,
